<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Movie Search</title>
  <link rel="stylesheet" href="index.css">
</head>

<body onload="search()">
  <header>
    <h1>Movie Search 🎥</h1>

    <nav>
      <a href="watchlist.html">My Watchlist</a>
    </nav>
  </header>

  <main>
    <section class="search">
      <form id="form">
        <input type="text" id="searchInput" value="Avengers" placeholder="Enter movie title...">
        <button id="searchBtn">Search</button>
      </form>
    </section>

    <section id="moviesContainer" class="movie-list">
      <div class="movie-card">
        <img src="" alt="something related to title ">
        <div class="movie-info">
          <h5>Example Movie Title</h5>
          <p>Year: 2020</p>
          <div class="add-wishlish">
            <button class="add-btn">+</button>
            <label>Add to watchlist</label>
          </div>
        </div>
      </div>

      <div class="movie-card">
        <img src="" alt="something related to title">
        <div class="movie-info">
          <h5>Another Movie</h5>
          <p>Year: 2019</p>
          <button class="add-btn">+</button>
          <label>Add to watchlist</label>
        </div>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>

</html>
